{% extends 'base.html' %}

{% block title %}{{ post.title }} — Блог{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <a href="{% url 'blog_list' %}" class="btn btn-outline-secondary mb-3">
            <i class="bi bi-arrow-left"></i> Назад к блогу
        </a>

        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="mb-3">{{ post.title }}</h1>
                <p class="text-muted small mb-4">
                    <i class="bi bi-person"></i>
                    {{ post.author.get_full_name|default:post.author.username|default:"Аноним" }}
                    · {{ post.created_at|date:"d.m.Y H:i" }}
                </p>

                <div class="post-content">
                    {{ post.text|linebreaks }}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
