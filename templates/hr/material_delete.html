{% extends 'base.html' %}

{% block title %}Удалить материал{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-danger">
            <div class="card-body p-4">

                <h3 class="text-danger mb-4">
                    <i class="bi bi-exclamation-triangle"></i> Удаление материала
                </h3>

                <p>Вы уверены, что хотите удалить материал:</p>
                <div class="alert alert-light border">
                    <em>«{{ material.title }}»</em>
                </div>

                <p class="text-muted">Это действие невозможно отменить.</p>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'hr_materials' %}" class="btn btn-secondary">
                            <i class="bi bi-x-circle"></i> Отмена
                        </a>
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash"></i> Удалить
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>
{% endblock %}
