{% extends 'base.html' %}

{% block title %}Обратная связь — Контроль знаний{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-body p-4">

                <h3 class="mb-4 text-center">
                    <i class="bi bi-envelope"></i> Обратная связь
                </h3>

                <p class="text-muted text-center mb-4">
                    Есть вопрос или предложение? Напишите нам — мы ответим.
                </p>

                <form method="post" novalidate id="feedbackForm">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">Ваше имя <span class="text-danger">*</span></label>
                        <input type="text" name="name" class="form-control" required maxlength="100">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email <span class="text-danger">*</span></label>
                        <input type="email" name="email" class="form-control" required maxlength="200">
                        <div class="form-text">На этот адрес мы отправим ответ.</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Сообщение <span class="text-danger">*</span></label>
                        <textarea name="text" class="form-control" rows="5" required maxlength="2000"></textarea>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{% url 'home' %}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left"></i> На главную
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-send"></i> Отправить
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // Простая JS-валидация перед отправкой
    document.getElementById('feedbackForm').addEventListener('submit', function (e) {
        const name = this.name.value.trim();
        const email = this.email.value.trim();
        const text = this.text.value.trim();

        if (!name || !email || !text) {
            e.preventDefault();
            alert('Заполните все обязательные поля.');
            return false;
        }

        if (!email.includes('@')) {
            e.preventDefault();
            alert('Введите корректный email.');
            return false;
        }
    });
</script>
{% endblock %}
